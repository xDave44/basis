<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self' https://*.googleapis.com https://www.gstatic.com https://*.firebaseio.com wss://*.firebaseio.com https://*.firebasedatabase.app wss://*.firebasedatabase.app; frame-src 'none'; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Basis</title>
<meta name="description" content="Persönliche Zentrale für To-Dos, Ideen, Habits und Dokumente">
<meta name="theme-color" content="#0C0B0A">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Basis">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preload" href="fonts/MonaSans-Variable.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="app.css">
<script type="module" src="app.js"></script>
</head>
<body>
<div id="gate" class="gate"></div>
<div id="app" class="app" hidden>
  <aside id="sidebar" class="sidebar" aria-label="Seitenleiste"></aside>
  <main id="screen" tabindex="-1"></main>
  <nav id="tabbar" class="tabbar" aria-label="Hauptbereiche"></nav>
  <button id="scrim" class="scrim" type="button" tabindex="-1" aria-hidden="true"></button>
  <section id="panel" class="panel" role="dialog" aria-label="Idee" aria-hidden="true" inert></section>
</div>
<div id="overlay" class="overlay" hidden></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<noscript><p class="gate-note">Basis braucht JavaScript.</p></noscript>
</body>
</html>
