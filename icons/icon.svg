      <stop offset="1" stop-color="#0E0E11"/>
    </linearGradient>
    <linearGradient id="or" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#FFB47E"/>
      <stop offset="0.5" stop-color="#FF8C42"/>
